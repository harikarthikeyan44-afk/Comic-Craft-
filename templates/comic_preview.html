<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Comic</title><link rel="stylesheet" href="/static/css/style.css"></head><body><header class="top"><a href="/">← New Comic</a><b>COMICCRAFT</b></header><main class="container"><h1>Your Comic Preview</h1>{% for p in layout %}<section class="panel"><div class="tag">Panel {{p.panel}}</div><h2>{{p.title}}</h2><img src="{{p.image_url}}" alt="Comic panel"><p class="scene">{{p.scene_description}}</p><div class="story">{{p.text}}</div><details><summary>Image prompt</summary><p>{{p.image_prompt}}</p></details></section>{% endfor %}<a class="button" href="{{pdf_url}}" target="_blank">📄 Download Your Comic as PDF</a></main></body></html>

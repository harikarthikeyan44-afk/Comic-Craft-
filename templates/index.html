<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ComicCraft</title><link rel="stylesheet" href="/static/css/style.css"></head><body class="hero"><main class="card"><b>🦊 COMICCRAFT</b><h1>Create Your AI Comic</h1><p>Turn one idea into a connected 5-panel comic.</p><form action="/generate" method="post"><label>Story Prompt</label><textarea name="story_prompt" required placeholder="A brave fox exploring an enchanted forest..."></textarea><label>Main Character Name</label><input name="character_name" value="Arin" required><label>Setting</label><select name="setting"><option>Forest</option><option>School</option><option>City</option><option>Space</option></select><label>Story Tone</label><select name="tone"><option>Funny</option><option>Light-hearted</option><option>Dramatic</option><option>Poetic</option></select><label>Art Style</label><select name="art_style"><option>Comic book</option><option>Anime</option><option>Pixel art</option><option>Realistic</option></select><button>✨ Generate Comic</button></form><div class="notice">For an easy laptop demo, keep DEMO_MODE=true. Full local Diffusers image generation can be enabled later.</div></main></body></html>
